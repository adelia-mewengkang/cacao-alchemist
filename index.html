(function initInfoModal() {
  const openBtn = document.getElementById('btn-info-credits');
  const backdrop = document.getElementById('info-modal-backdrop');
  const modalBox = document.getElementById('info-modal-box');
  const closeBtnX = document.getElementById('btn-close-modal-x');
  const closeBtnFooter = document.getElementById('btn-close-modal-footer');

  function openModal() {
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
    closeBtnFooter.focus();
  }

  function closeModal() {
    backdrop.classList.add('hidden');
    backdrop.classList.remove('flex');
  }

  openBtn.addEventListener('click', openModal);
  closeBtnX.addEventListener('click', closeModal);
  closeBtnFooter.addEventListener('click', closeModal);

  // Tutup modal ketika pengguna mengklik area luar kotak pop-up (backdrop)
  backdrop.addEventListener('click', (e) => {
    if (!modalBox.contains(e.target)) {
      closeModal();
    }
  });

  // Tutup modal dengan tombol Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !backdrop.classList.contains('hidden')) {
      closeModal();
    }
  });
})();

// ============================================================================
// EFEK SUARA MEKANIK PISAU GUILLOTINE (WEB AUDIO API TANPA URL EKSTERNAL)
// ============================================================================
function playGuillotineSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;

    // Bunyi gesekan logam bilah meluncur turun
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.14);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.17);

    // Bunyi benturan "KLAK!" pada landasan kayu
    const thud = ctx.createOscillator();
    const thudGain = ctx.createGain();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(160, now + 0.12);
    thud.frequency.exponentialRampToValueAtTime(48, now + 0.28);
    thudGain.gain.setValueAtTime(0.28, now + 0.12);
    thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    thud.connect(thudGain);
    thudGain.connect(ctx.destination);
    thud.start(now + 0.12);
    thud.stop(now + 0.31);
  } catch (err) {
    // Abaikan jika browser memblokir audio otomatis
  }
}

function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-16 sm:bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full font-bold text-xs sm:text-sm border-2 border-white shadow-xl transition-opacity duration-300 opacity-100 text-center max-w-[92vw] ${
    type === 'warn' ? 'bg-amber-600 text-white' : type === 'err' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'
  }`;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { el.style.opacity = '0'; }, 2600);
}

// LOGIKA PENENTUAN HASIL FERMENTASI (5 SAMPEL BIJI)
// ============================================================================
function computeCutTestSamples() {
  const { day, temp, turnsDone, totalTurns } = State;
  const turnedDay2 = turnsDone.includes(2);
  const turnedDay4 = turnsDone.includes(4);

  if (totalTurns >= 4) {
    return ['moldy', 'moldy', 'moldy', 'partly', 'brown'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  if (totalTurns === 0 && day >= 4) {
    return ['slaty', 'slaty', 'slaty', 'purple', 'partly'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  if (day <= 3 || temp < 38) {
    return ['purple', 'purple', 'purple', 'slaty', 'partly'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  if (day === 6 && turnedDay2 && turnedDay4 && temp >= 45 && temp <= 50) {
    return ['brown', 'brown', 'brown', 'brown', 'brown'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
  }

  return ['partly', 'partly', 'brown', 'brown', 'purple'].map((t, i) => ({ id: i, type: t, cut: false, justCut: false }));
}

function startFermentationStage() {
  clearCutTimers();
  State.day = 1;
  State.temp = 28;
  State.tempHistory = [28];
  State.ph = 5.6;
  State.pulpLevel = 100;
  State.turnsDone = [];
  State.totalTurns = 0;
  State.leafClosed = true;

  renderFermentationStage();
}

function advanceDay() {
  if (State.day >= 6) return;

  if ((State.day === 2 || State.day === 4) && !State.turnsDone.includes(State.day)) {
    showToast(`⚠️ Kamu melewatkan pembalikan Hari ke-${State.day}! Aerasi oksigen & suhu menjadi kurang optimal.`, 'warn');
  }

  State.day++;

  if (State.day === 2) {
    State.temp = State.leafClosed ? 42 : 36;
    State.ph = 4.9;
    State.pulpLevel = 72;
  } else if (State.day === 3) {
    State.temp = State.turnsDone.includes(2) ? (State.leafClosed ? 48 : 42) : 34;
    State.ph = 4.4;
    State.pulpLevel = 45;
  } else if (State.day === 4) {
    State.temp = State.turnsDone.includes(2) ? (State.leafClosed ? 47 : 41) : 33;
    State.ph = 4.3;
    State.pulpLevel = 25;
  } else if (State.day >= 5) {
    State.ph = State.day === 5 ? 4.6 : 4.9;
    State.pulpLevel = State.day === 5 ? 12 : 5;
    if (State.turnsDone.includes(2) && State.turnsDone.includes(4)) {
      State.temp = State.leafClosed ? 48 : 43;
    } else if (State.turnsDone.length > 0) {
      State.temp = State.leafClosed ? 41 : 36;
    } else {
      State.temp = 31;
    }
  }

  State.tempHistory.push(State.temp);

  if (State.day === 6) {
    showToast('🏁 Fermentasi mencapai Hari ke-6! Silakan tekan tombol "Lanjut ke Uji Belah Biji (Cut Test)" jika sudah siap.');
  } else {
    showToast(`📅 Memasuki Hari ke-${State.day}. Pilih tindakan hari ini sebelum menekan "Lanjut Hari ke-${State.day + 1}".`);
  }

  renderFermentationStage();
}

function svgMiniTempGraph() {
  const pts = State.tempHistory.map((t, idx) => {
    const x = 22 + idx * 42;
    const y = 62 - ((t - 25) / 30) * 48;
    return `${x},${Math.max(8, Math.min(62, y))}`;
  }).join(' ');

  return `<svg viewBox="0 0 260 72" class="w-full h-16 bg-black/35 rounded-xl border border-amber-900/50 p-1">
    <rect x="18" y="14" width="225" height="10" fill="#10b981" opacity="0.22"/>
    <text x="240" y="22" text-anchor="end" font-size="8" fill="#6ee7b7" font-weight="bold">45–50°C</text>
    <polyline fill="none" stroke="#facc15" stroke-width="2.5" points="${pts}"/>
    ${State.tempHistory.map((t, idx) => {
      const x = 22 + idx * 42;
      const y = Math.max(8, Math.min(62, 62 - ((t - 25) / 30) * 48));
      return `<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" stroke="#b45309" stroke-width="1.5"/>`;
    }).join('')}
  </svg>`;
}

// 4. LABORATORIUM BELAHAN BIJI VIRTUAL DENGAN ALAT PISAU GUILLOTINE
// ============================================================================
function executeGuillotineCut(idx, onComplete = null) {
  if (State.isChopping) return;
  const targetSample = State.samples[idx];
  if (!targetSample) return;

  State.selectedSampleIdx = idx;
  State.samples.forEach(s => { s.justCut = false; });

  // Jika biji sudah pernah dibelah, cukup tampilkan di dudukan guillotine
  if (targetSample.cut) {
    renderCutTestStage();
    if (onComplete) onComplete();
    return;
  }

  // Jalankan animasi pisau guillotine turun membelah biji
  State.isChopping = true;
  targetSample.cut = true;
  targetSample.justCut = true;
  State.cutCount++;

  playGuillotineSound();
  renderCutTestStage();

  chopTimeout = setTimeout(() => {
    State.isChopping = false;
    renderCutTestStage();
    if (onComplete) onComplete();
  }, 680);
}

      <div class="flex items-center gap-2">
        <div class="wood-panel px-3 py-1.5 text-xs sm:text-sm font-bold text-amber-200">
          Terbelah: <span class="text-yellow-300">${State.cutCount} / ${State.samples.length}</span>
        </div>
        <button id="btn-cut-home" class="btn-3d btn-wood px-3 py-2 text-xs sm:text-sm">🏠 Menu</button>
      </div>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch my-auto py-3">
      <!-- Kolom Kiri: Stasiun Alat Pisau Guillotine & Baki 5 Sampel -->
      <div class="lg:col-span-7 cut-board p-3.5 sm:p-4 flex flex-col justify-between space-y-3">
        <div class="flex flex-wrap justify-between items-center gap-2">
          <span class="bg-[#2b1405]/90 text-amber-200 px-3 py-1 rounded-full text-xs font-bold border border-amber-700">
            🪵 Meja Uji Belah Longitudinal (SNI 2323:2008)
          </span>
          <button id="btn-cut-all" ${allCut || State.isChopping || State.batchCutRunning ? 'disabled' : ''} class="btn-3d btn-gold px-3 py-1 text-xs">
            ${State.batchCutRunning ? '⏳ Memotong Berurutan...' : '⚡ Belah Semua dengan Guillotine'}
          </button>
        </div>

        <!-- Stasiun Pemotong Pisau Guillotine Interaktif -->
        <div class="bg-black/25 rounded-2xl p-2.5 border-2 border-amber-950/60 flex flex-col items-center">
          ${svgGuillotineStation(activeSample, activeIdx, State.isChopping)}

          <div class="mt-2 flex flex-wrap justify-center gap-2 w-full">
            <button id="btn-press-guillotine" ${activeSample.cut || State.isChopping || State.batchCutRunning ? 'disabled' : ''} class="btn-3d btn-red px-5 py-2 text-xs sm:text-sm shadow-lg ${!activeSample.cut && !State.isChopping ? 'ring-2 ring-yellow-300' : ''}">
              ${State.isChopping ? '⚙️ Bilah Pisau Memotong...' : activeSample.cut ? `✓ Sampel #${activeIdx + 1} Sudah Terbelah` : `🔪 Tekan Gagang Pisau Guillotine (Sampel #${activeIdx + 1})`}
            </button>
          </div>
        </div>

        <!-- Baki 5 Sampel Biji Kakao -->
        <div>
          <div class="text-[11px] text-amber-100 font-bold mb-1.5 text-center">
            👇 Klik sampel biji di baki untuk memasukkannya ke dudukan Pisau Guillotine &amp; membelahnya:
          </div>
          <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
            ${State.samples.map((item, idx) => {
              const info = BEAN_CATEGORIES[item.type];
              const isSelected = activeIdx === idx;
              return `
                <div data-sample="${idx}" class="cursor-pointer rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-center transition-all border-2 ${
                  isSelected ? 'bg-amber-200/40 border-yellow-300 scale-[1.04] shadow-lg' : 'bg-black/30 border-amber-950/60 hover:bg-black/45'
                }">
                  ${svgBeanTrayItem(item.type, item.cut, item.justCut)}
                  <span class="mt-1 text-[9px] sm:text-[10px] font-extrabold px-1.5 py-0.5 rounded-full text-center leading-tight ${
                    item.cut ? info.badgeClass : 'bg-stone-800 text-amber-200'
                  }">
                    ${item.cut ? info.sniBadge : `Biji #${idx + 1}`}
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="text-center text-xs text-amber-100 font-semibold">
          Parameter batch ini: Fermentasi <b>${State.day} Hari</b> · Pembalikan <b>${State.totalTurns}x</b> · Suhu Akhir <b>${State.temp}°C</b>
        </div>
      </div>

      <!-- Kolom Kanan: Panel Analisis Mikroskop Kotiledon -->
      <div class="lg:col-span-5 parchment p-4 flex flex-col justify-between">
        ${selInfo ? `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2 border-b-2 border-amber-900/20 pb-2">
              <span class="text-xs font-extrabold uppercase text-amber-800">Penampang Keping Biji #${activeIdx + 1}</span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${selInfo.badgeClass}">${selInfo.sniBadge}</span>
            </div>

            <h3 class="text-lg font-extrabold text-amber-950">${selInfo.title}</h3>

            <div class="bg-amber-950/10 rounded-xl p-2 flex justify-center">
              ${svgBeanTrayItem(activeSample.type, true, false)}
            </div>

            <div class="space-y-2 text-xs sm:text-sm">
              <div class="bg-white/80 p-2.5 rounded-lg border border-amber-900/20">
                <b class="text-amber-950">⚗️ Klasifikasi Perubahan:</b> <span class="font-bold text-amber-800">${selInfo.changeType}</span>
                <p class="text-stone-800 mt-1">${selInfo.science}</p>
              </div>
              <div class="bg-white/80 p-2.5 rounded-lg border border-amber-900/20">
                <b class="text-amber-950">👅 Dampak Mutu &amp; Cita Rasa:</b>
                <p class="text-stone-800 mt-0.5">${selInfo.flavor}</p>
              </div>
            </div>
          </div>
        ` : `
          <div class="my-auto text-center space-y-3 py-6">
            <div class="text-5xl">⚙️🔪</div>
            <h3 class="text-lg font-extrabold text-amber-950">Sampel #${activeIdx + 1} Siap Dibelah</h3>
            <p class="text-xs sm:text-sm text-stone-700 leading-relaxed">
              Sampel biji kakao sudah berada di dalam dudukan <b>Alat Pisau Guillotine</b>. Tekan tombol merah <b>"Tekan Gagang Pisau Guillotine"</b> atau klik langsung sampel biji di baki untuk menurunkan bilah pisau dan mengamati penampang dalam keping biji (<i>kotiledon</i>).
            </p>
          </div>
        `}

        <div class="pt-3 mt-2 border-t-2 border-amber-900/20 flex flex-col gap-2">
          <button id="btn-to-report" ${!allCut || State.isChopping || State.batchCutRunning ? 'disabled' : ''} class="btn-3d btn-green py-2.5 px-4 text-xs sm:text-sm w-full">
            ${allCut ? '📊 Lanjut ke Galeri Perbandingan & Kuis SNI' : `Belah Semua Biji Dulu (${State.cutCount}/${State.samples.length})`}
          </button>
          <button id="btn-retry-ferm" class="btn-3d btn-wood py-2 px-4 text-xs w-full">
            ⟳ Ulangi Pengaturan Fermentasi
          </button>
        </div>
      </div>
    </section>
  `;

  document.getElementById('btn-cut-home').onclick = renderMenu;
  document.getElementById('btn-retry-ferm').onclick = startFermentationStage;

  // Tombol Tekan Gagang Pisau Guillotine
  const btnGuillotine = document.getElementById('btn-press-guillotine');
  if (btnGuillotine) {
    btnGuillotine.onclick = () => {
      if (State.isChopping || State.batchCutRunning) return;
      executeGuillotineCut(activeIdx);
    };
  }

  // Klik pada salah satu dari 5 sampel di baki
  document.querySelectorAll('[data-sample]').forEach(card => {
    card.onclick = () => {
      if (State.isChopping || State.batchCutRunning) return;
      const idx = Number(card.dataset.sample);
      executeGuillotineCut(idx);
    };
  });

  // Tombol Belah Semua dengan Guillotine secara berurutan
  document.getElementById('btn-cut-all').onclick = () => {
    if (State.isChopping || State.batchCutRunning || allCut) return;
    State.batchCutRunning = true;

    const cutNextRemaining = () => {
      const nextIdx = State.samples.findIndex(s => !s.cut);
      if (nextIdx === -1) {
        State.batchCutRunning = false;
        renderCutTestStage();
        showToast('✅ Seluruh 5 sampel biji berhasil dibelah dengan Pisau Guillotine!');
        return;
      }
      executeGuillotineCut(nextIdx, () => {
        setTimeout(cutNextRemaining, 160);
      });
    };

    cutNextRemaining();
  };

  document.getElementById('btn-to-report').onclick = () => {
    clearCutTimers();
    const brownCount = State.samples.filter(s => s.type === 'brown').length;
    const batchPts = brownCount * 20;
    State.totalScore = Math.max(State.totalScore, batchPts);
    State.quizIdx = 0;
    State.quizScore = 0;
    State.quizAnswered = false;
    renderGalleryAndQuiz('brown');
  };
}

// ============================================================================
// 5. GALERI PERBANDINGAN 5 BELAHAN & KUIS REFLEKSI
// ============================================================================
function renderGalleryAndQuiz(selectedType = 'brown') {
  clearCutTimers();
  State.gallerySelected = selectedType;
  appEl.className = 'w-full max-w-[1140px] rounded-2xl overflow-hidden shadow-2xl border-4 border-[#361c08] bg-tropical flex flex-col justify-between min-h-[640px]';

  const keys = ['purple', 'partly', 'brown', 'slaty', 'moldy'];
  const activeCat = BEAN_CATEGORIES[selectedType];
  const currentQuiz = QUIZ_QUESTIONS[State.quizIdx];

  const hasBatch = State.samples && State.samples.length > 0;
  const brownCount = hasBatch ? State.samples.filter(s => s.type === 'brown').length : 0;

  screenEl.innerHTML = `
    <header class="flex flex-wrap justify-between items-center gap-2">
      <div class="wood-panel px-4 py-2 flex items-center gap-3">
        <span class="text-2xl">🔬</span>
        <div>
          <h2 class="text-base sm:text-xl font-bold text-yellow-300 leading-tight">Galeri Standar Mutu Cut Test (SNI) &amp; Kuis IPAS</h2>
          <p class="text-xs text-amber-100">Bandingkan 5 standar visual belahan biji kakao dan uji pemahamanmu!</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="wood-panel px-3 py-1.5 text-xs sm:text-sm font-bold text-amber-200">
          ⭐ Total Skor: <span class="text-yellow-300">${State.totalScore + State.quizScore}</span>
        </div>
        <button id="btn-gal-study" class="btn-3d btn-gold px-3 py-2 text-xs sm:text-sm">📖 Materi</button>
        <button id="btn-gal-home" class="btn-3d btn-wood px-3 py-2 text-xs sm:text-sm">🏠 Menu</button>
      </div>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch my-auto py-3">
      <div class="lg:col-span-7 parchment p-4 flex flex-col justify-between space-y-3">
        <div>
          <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
            <h3 class="font-extrabold text-amber-950 text-sm sm:text-base">📊 Klik Warna Keping Biji untuk Membandingkan:</h3>
            ${hasBatch ? `<span class="text-xs bg-emerald-100 text-emerald-900 border border-emerald-400 px-2.5 py-0.5 rounded-full font-bold">Hasil Simulasimu: ${brownCount}/5 Mutu AA</span>` : ''}
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
            ${keys.map(k => {
              const item = BEAN_CATEGORIES[k];
              const isSel = k === selectedType;
              return `
                <div data-gal="${k}" class="cursor-pointer rounded-xl p-2 flex flex-col items-center text-center border-2 transition-all ${
                  isSel ? 'bg-amber-200 border-amber-700 scale-[1.03] shadow-md' : 'bg-white/75 border-amber-900/20 hover:bg-amber-50'
                }">
                  <div class="w-full max-w-[96px]">${svgBeanTrayItem(k, true, false)}</div>
                  <span class="mt-1 text-[10px] font-extrabold leading-tight px-1.5 py-0.5 rounded-full ${item.badgeClass}">
                    ${item.sniBadge}
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="bg-white/85 rounded-xl p-3 border-2 border-amber-900/20 space-y-1.5 text-xs sm:text-sm">
          <div class="flex flex-wrap justify-between items-center gap-1">
            <h4 class="font-extrabold text-amber-950 text-base">${activeCat.title}</h4>
            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${activeCat.badgeClass}">${activeCat.changeType}</span>
          </div>
          <p class="text-stone-800"><b>Analisis Sains:</b> ${activeCat.science}</p>
          <p class="text-stone-800"><b>Cita Rasa &amp; Mutu:</b> ${activeCat.flavor}</p>
        </div>
      </div>

      <div class="lg:col-span-5 wood-panel p-4 flex flex-col justify-between space-y-3">
        <div>
          <div class="flex justify-between items-center border-b border-amber-700/50 pb-2 mb-2">
            <span class="font-extrabold text-yellow-300 text-sm">🧠 Kuis Refleksi Projek IPAS</span>
            <span class="text-xs bg-black/40 px-2.5 py-0.5 rounded-full text-amber-200 font-bold">
              Soal ${State.quizIdx + 1} / ${QUIZ_QUESTIONS.length}
            </span>
          </div>

          <p class="text-xs sm:text-sm font-bold text-white leading-relaxed mb-3">
            ${currentQuiz.q}
          </p>

          <div class="space-y-2" id="quiz-choices">
            ${currentQuiz.opts.map((optText, i) => `
              <button data-qopt="${i}" class="w-full text-left p-2.5 rounded-xl text-xs sm:text-sm font-bold border-2 transition-all bg-[#fff8eb] text-[#3b1e08] border-amber-900 hover:bg-amber-100">
                ${String.fromCharCode(65 + i)}. ${optText}
              </button>
            `).join('')}
          </div>

          <div id="quiz-feedback" class="hidden mt-3 p-2.5 rounded-xl text-xs leading-relaxed font-semibold bg-black/45 border border-amber-400/50 text-amber-100"></div>
        </div>

        <div class="pt-2 border-t border-amber-700/50 flex flex-wrap gap-2 justify-between">
          <button id="btn-gal-sim" class="btn-3d btn-green px-4 py-2 text-xs sm:text-sm flex-1">
            🔄 Main Simulasi Lagi
          </button>
          <button id="btn-next-quiz" class="btn-3d btn-gold px-4 py-2 text-xs sm:text-sm hidden">
            Soal Berikutnya ▶
          </button>
        </div>
      </div>
    </section>
  `;

  document.getElementById('btn-gal-home').onclick = renderMenu;
  document.getElementById('btn-gal-study').onclick = () => renderStudyModule(1);
  document.getElementById('btn-gal-sim').onclick = startFermentationStage;

  document.querySelectorAll('[data-gal]').forEach(el => {
    el.onclick = () => renderGalleryAndQuiz(el.dataset.gal);
  });

  document.querySelectorAll('[data-qopt]').forEach(btn => {
    btn.onclick = () => {
      if (State.quizAnswered) return;
      State.quizAnswered = true;
      const chosen = Number(btn.dataset.qopt);
      const isRight = chosen === currentQuiz.ans;

      document.querySelectorAll('[data-qopt]').forEach((b, idx) => {
        if (idx === currentQuiz.ans) {
          b.className = 'w-full text-left p-2.5 rounded-xl text-xs sm:text-sm font-bold border-2 bg-emerald-600 text-white border-emerald-900';
        } else if (idx === chosen && !isRight) {
          b.className = 'w-full text-left p-2.5 rounded-xl text-xs sm:text-sm font-bold border-2 bg-red-600 text-white border-red-900';
        }
      });

      const fb = document.getElementById('quiz-feedback');
      fb.classList.remove('hidden');
      if (isRight) {
        State.quizScore += 30;
        fb.innerHTML = `✅ <b>Benar (+30 Poin)!</b> ${currentQuiz.exp}`;
        showToast('🎉 Jawaban Tepat! +30 Poin');
      } else {
        fb.innerHTML = `💡 <b>Kurang Tepat.</b> ${currentQuiz.exp}`;
        showToast('Perhatikan penjelasan ilmiah di kotak kuis!', 'warn');
      }

      const nextQBtn = document.getElementById('btn-next-quiz');
      if (State.quizIdx < QUIZ_QUESTIONS.length - 1) {
        nextQBtn.classList.remove('hidden');
        nextQBtn.onclick = () => {
          State.quizIdx++;
          State.quizAnswered = false;
          renderGalleryAndQuiz(State.gallerySelected);
        };
      } else {
        nextQBtn.classList.remove('hidden');
        nextQBtn.textContent = '🏆 Selesai Kuis';
        nextQBtn.onclick = () => {
          State.totalScore += State.quizScore;
          State.quizScore = 0;
          showToast(`🏆 Kuis selesai! Total skormu sekarang: ${State.totalScore} Poin!`);
          renderGalleryAndQuiz(State.gallerySelected);
        };
      }
    };
  });
}

// Inisialisasi aplikasi saat halaman dimuat
renderMenu();
</script>
</body>
</html>
